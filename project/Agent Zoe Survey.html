<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agent Zoe Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet" />
<style>
/* ═══════════════════════════════════════════════════════
   TOKENS — matches site design system
═══════════════════════════════════════════════════════ */
:root {
  --font-head: 'Newsreader', Georgia, serif;
  --font-body: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  --head-weight: 400;
  --head-tracking: -0.012em;
  --accent:  #51624f;
  --accent2: #8a9a86;
  --fg:      #232220;
  --muted:   #6e6a62;
  --faint:   #a39d92;
  --hair:    rgba(35,34,32,0.11);
  --paper:   #f4f0e8;
  --surface: #ffffff;
  --btn-bg:  #232220;
  --btn-fg:  #f6f3ec;
  --footer-bg: rgba(244,240,232,0.92);
}
body.theme-dark {
  --fg:      #edeae2;
  --muted:   #a7aca2;
  --faint:   #6f746c;
  --hair:    rgba(237,234,226,0.13);
  --paper:   #161a17;
  --surface: rgba(237,234,226,0.05);
  --btn-bg:  #edeae2;
  --btn-fg:  #15180f;
  --footer-bg: rgba(22,26,23,0.92);
}

/* ═══════════════════════════════════════════════════════
   RESET + BASE
═══════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; }
body {
  margin: 0; min-height: 100%;
  background: var(--paper); color: var(--fg);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  transition: background 0.35s ease, color 0.35s ease;
}
body.theme-dark {
  background: radial-gradient(140% 120% at 50% 0%, #1d221e 0%, #161a17 52%, #10130e 100%);
}
button { cursor: pointer; font-family: inherit; }
a { color: inherit; }
::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }

/* ═══════════════════════════════════════════════════════
   WORDMARK — reused from landing-ui.jsx
═══════════════════════════════════════════════════════ */
.wordmark { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; }
.wordmark__mark { width: 7px; height: 7px; transform: rotate(45deg); border: 1px solid var(--accent); flex-shrink: 0; }
.wordmark__name { font-family: var(--font-head); font-weight: 500; font-size: 19px; letter-spacing: 0.004em; color: var(--fg); white-space: nowrap; }

.survey-eyebrow {
  margin: 0; display: flex; align-items: center; gap: 10px;
  font-family: var(--font-body); font-size: 11px; font-weight: 500;
  letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted);
}
.survey-eyebrow__tick { width: 12px; height: 1px; background: var(--accent); flex-shrink: 0; }

/* ═══════════════════════════════════════════════════════
   PROGRESS HAIRLINE
═══════════════════════════════════════════════════════ */
.survey-progress {
  position: fixed; top: 0; left: 0; right: 0; height: 4px; z-index: 100;
  background: color-mix(in srgb, var(--accent) 18%, transparent);
  pointer-events: none;
}
.survey-progress__bar {
  height: 100%; transform-origin: left center; transform: scaleX(0);
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  box-shadow: 0 0 14px -1px color-mix(in srgb, var(--accent) 65%, transparent);
  transition: transform 0.55s cubic-bezier(0.25, 1, 0.5, 1);
}

/* ═══════════════════════════════════════════════════════
   NAV
═══════════════════════════════════════════════════════ */
.survey-nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 60;
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px clamp(24px, 5vw, 52px);
  background: var(--footer-bg);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--hair);
}
.survey-exit {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 12.5px; letter-spacing: 0.01em; color: var(--muted);
  text-decoration: none;
  border-bottom: 1px solid transparent; padding-bottom: 2px;
  transition: color .2s, border-color .2s;
}
.survey-exit:hover { color: var(--fg); border-bottom-color: var(--accent); }

/* ═══════════════════════════════════════════════════════
   PAGE SHELL
═══════════════════════════════════════════════════════ */
.survey-page { display: flex; flex-direction: column; min-height: 100dvh; }
.survey-stage {
  flex: 1;
  display: flex; align-items: flex-start; justify-content: center;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: clamp(28px, 5vh, 64px) clamp(20px, 5vw, 48px) 24px;
  padding-top: calc(64px + clamp(28px, 5vh, 64px));
}
.survey-content { width: 100%; max-width: 560px; }

/* ═══════════════════════════════════════════════════════
   INTRO SCREEN
═══════════════════════════════════════════════════════ */
.survey-intro { display: flex; flex-direction: column; gap: 22px; padding-top: clamp(16px, 4vh, 48px); }
.survey-intro__title {
  margin: 0; font-family: var(--font-head); font-weight: var(--head-weight);
  font-size: clamp(26px, 4vw, 44px); line-height: 1.08;
  letter-spacing: var(--head-tracking); text-wrap: balance; color: var(--fg);
}
.survey-intro__body {
  margin: 0; font-size: 17px; line-height: 1.65; color: var(--muted); max-width: 54ch;
  white-space: pre-line;
}
.survey-intro__actions { display: flex; flex-direction: column; gap: 14px; padding-top: 6px; }
.survey-intro__meta {
  margin: 0; font-family: var(--font-mono); font-size: 12px; font-weight: 500;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg); opacity: 0.55;
}

/* ═══════════════════════════════════════════════════════
   SHARED BUTTONS
═══════════════════════════════════════════════════════ */
.survey-primary-btn {
  display: inline-flex; align-items: center; gap: 10px;
  background: var(--btn-bg); color: var(--btn-fg);
  border: none; border-radius: 4px;
  font-size: 13.5px; font-weight: 500; letter-spacing: 0.01em;
  padding: 13px 22px; align-self: flex-start;
  transition: transform 0.18s, filter 0.2s, opacity 0.2s;
}
.survey-primary-btn:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.08); }
.survey-primary-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.survey-resume-btn {
  background: none; border: none; padding: 0;
  font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.04em;
  color: var(--accent); cursor: pointer; align-self: flex-start;
  transition: opacity 0.2s;
}
.survey-resume-btn:hover { opacity: 0.7; }

/* ═══════════════════════════════════════════════════════
   PROGRESSIVE-DISCLOSURE SCROLL LIST
═══════════════════════════════════════════════════════ */
@keyframes q-dissolve { from { opacity:0; transform: translateY(18px); } to { opacity:1; transform: none; } }

.survey-scroll-list { display: flex; flex-direction: column; gap: 64px; padding-bottom: 96px; }

.survey-q-section { transition: opacity .4s; animation: q-dissolve 0.38s cubic-bezier(0.22, 0.61, 0.36, 1) both; }
.survey-q-section.is-answered:not(.is-active) { opacity: 0.45; }
.survey-q-section.is-active .q-text { color: var(--fg); }

.survey-q-continue {
  margin-top: 22px; display: inline-flex; align-items: center; gap: 7px;
  font-size: 13.5px; font-weight: 500; color: var(--accent);
  background: none; border: none; cursor: pointer; padding: 0;
  transition: opacity .2s;
}
.survey-q-continue:hover { opacity: 0.65; }

.survey-submit-row { padding-top: 32px; border-top: 1px solid var(--hair); animation: q-dissolve 0.38s cubic-bezier(0.22, 0.61, 0.36, 1) both; }

.survey-phase { animation: q-dissolve 0.36s ease both; }

/* ═══════════════════════════════════════════════════════
   QUESTION META
═══════════════════════════════════════════════════════ */
.q-meta { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.q-section {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--font-body); font-size: 11px; font-weight: 500;
  letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted);
}
.q-section__tick { width: 12px; height: 1px; background: var(--accent); flex-shrink: 0; }
.q-meta-right {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-mono); font-size: 12px; font-weight: 500;
  color: var(--fg); opacity: 0.55; letter-spacing: 0.04em; white-space: nowrap;
}
.q-meta-right__sep { opacity: 0.4; }
.q-text {
  margin: 0; font-family: var(--font-head); font-weight: var(--head-weight);
  font-size: clamp(20px, 3.2vw, 32px); line-height: 1.12;
  letter-spacing: var(--head-tracking); text-wrap: balance; color: var(--fg);
}
.q-hint { margin: 0; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em; color: var(--faint); }
.q-context { margin: 0; font-size: 13.5px; line-height: 1.55; color: var(--muted); }

/* ═══════════════════════════════════════════════════════
   OPTIONS — single + multi
═══════════════════════════════════════════════════════ */
.q-options { display: flex; flex-direction: column; gap: 8px; }
.q-options--grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.q-option {
  display: flex; align-items: center; gap: 13px;
  padding: 13px 16px; width: 100%; text-align: left;
  background: rgba(255,255,255,0.72); border: 1px solid rgba(35,34,32,0.16); border-radius: 4px;
  color: var(--fg); font-size: 15.5px; font-weight: 400;
  transition: border-color 0.17s, background 0.17s;
}
body.theme-dark .q-option { background: rgba(237,234,226,0.06); border-color: rgba(237,234,226,0.18); }
.q-option:hover:not(.is-dim) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 5%, transparent); }
.q-option.is-selected        { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, transparent); }
.q-option.is-dim             { opacity: 0.36; cursor: not-allowed; }
.q-option__label             { flex: 1; line-height: 1.4; }

.opt-ind {
  width: 15px; height: 15px; flex-shrink: 0;
  border: 1px solid var(--hair);
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, border-color 0.15s, color 0.15s; color: #fff;
}
.opt-ind--single { border-radius: 50%; }
.opt-ind--multi  { border-radius: 3px; }
.opt-ind.is-on   { background: var(--accent); border-color: var(--accent); }

.q-other-wrap { margin-top: 10px; animation: q-dissolve 0.22s ease both; }
.q-other-input { font-size: 15px; }

/* ═══════════════════════════════════════════════════════
   RATING MATRIX
═══════════════════════════════════════════════════════ */
.rating-matrix { display: flex; flex-direction: column; }
.rating-matrix__header { display: flex; align-items: center; margin-bottom: 2px; }
.rating-matrix__spacer { flex: 1; }
.rating-matrix__nums { display: flex; gap: 6px; }
.rating-matrix__num {
  width: 34px; text-align: center;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.04em; color: var(--faint);
}
.rating-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--hair);
}
.rating-row:last-of-type { border-bottom: none; }
.rating-row__label { flex: 1; font-size: 15px; color: var(--fg); line-height: 1.3; min-width: 0; }
.rating-pips { display: flex; gap: 6px; flex-shrink: 0; }
.rating-pip {
  width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid var(--hair); background: transparent;
  font-family: var(--font-mono); font-size: 0; cursor: pointer;
  transition: background 0.14s, border-color 0.14s, transform 0.12s;
}
.rating-pip:hover     { border-color: var(--accent); transform: scale(1.1); }
.rating-pip.is-filled { background: color-mix(in srgb, var(--accent) 20%, transparent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.rating-pip.is-active { background: var(--accent); border-color: var(--accent); transform: scale(1.1); }
.rating-matrix__legend {
  display: flex; justify-content: space-between; padding-top: 10px;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.04em; color: var(--faint);
}
@media (max-width: 480px) {
  .rating-matrix__header { display: none; }
  .rating-row { flex-direction: column; align-items: flex-start; gap: 10px; }
  .rating-row__label { font-size: 14px; }
  .rating-pip { width: 38px; height: 38px; }
  .rating-matrix__nums, .rating-matrix__spacer { display: none; }
}

/* ═══════════════════════════════════════════════════════
   SCALE SELECT
═══════════════════════════════════════════════════════ */
.q-scale { display: flex; flex-direction: column; gap: 8px; }
.q-scale-item {
  display: flex; align-items: center; gap: 14px;
  padding: 13px 16px; width: 100%; text-align: left;
  background: transparent; border: 1px solid var(--hair); border-radius: 4px;
  font-size: 15.5px; transition: border-color 0.17s, background 0.17s;
}
.q-scale-item:hover     { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 5%, transparent); }
.q-scale-item.is-selected { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, transparent); }
.q-scale-item__num   { font-family: var(--font-mono); font-size: 11px; color: var(--accent); min-width: 16px; }
.q-scale-item__label { color: var(--fg); }

/* sticky footer removed — replaced by progressive-disclosure inline flow */

/* ═══════════════════════════════════════════════════════
   CONTACT FORM
═══════════════════════════════════════════════════════ */
.survey-contact { display: flex; flex-direction: column; gap: 22px; padding-top: clamp(12px, 3vh, 36px); }
.survey-contact__title {
  margin: 0; font-family: var(--font-head); font-weight: var(--head-weight);
  font-size: clamp(22px, 3.2vw, 34px); line-height: 1.1;
  letter-spacing: var(--head-tracking); color: var(--fg);
}
.survey-contact__body { margin: 0; font-size: 16.5px; line-height: 1.6; color: var(--muted); max-width: 52ch; }
.survey-contact__form { display: flex; flex-direction: column; gap: 10px; }
.survey-field {
  background: transparent; border: none; border-bottom: 1px solid var(--hair);
  color: var(--fg); font-family: var(--font-body); font-size: 15.5px;
  padding: 12px 2px; outline: none; transition: border-color 0.25s; width: 100%;
}
.survey-field::placeholder { color: var(--faint); }
.survey-field:focus        { border-bottom-color: var(--accent); }
.survey-field:disabled     { opacity: 0.5; }
.survey-contact__actions { display: flex; flex-direction: column; gap: 14px; padding-top: 10px; }
.survey-anon-btn {
  background: none; border: none; padding: 0; text-align: left;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.05em;
  color: var(--faint); cursor: pointer; transition: color 0.2s;
}
.survey-anon-btn:hover { color: var(--muted); }
.survey-field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
@media (max-width: 520px) { .survey-field-row { grid-template-columns: 1fr; } }

/* ═══════════════════════════════════════════════════════
   COMPLETION SCREEN
═══════════════════════════════════════════════════════ */
.survey-complete { display: flex; flex-direction: column; gap: 20px; padding-top: clamp(16px, 5vh, 56px); }
.survey-complete__mark {
  display: block; width: 10px; height: 10px;
  transform: rotate(45deg); background: var(--accent);
}
.survey-complete__title {
  margin: 0; font-family: var(--font-head); font-weight: var(--head-weight);
  font-size: clamp(36px, 6vw, 72px); line-height: 0.95;
  letter-spacing: var(--head-tracking); color: var(--fg);
}
.survey-complete__message {
  margin: 0; font-size: 17px; line-height: 1.65; color: var(--muted); max-width: 48ch;
}
.survey-complete__link {
  font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--accent); text-decoration: none; transition: opacity 0.2s;
}
.survey-complete__link:hover { opacity: 0.65; }

/* ═══════════════════════════════════════════════════════
   ERROR SCREEN
═══════════════════════════════════════════════════════ */
.survey-error { display: flex; flex-direction: column; gap: 20px; padding-top: clamp(16px, 5vh, 56px); }
.survey-error__mark {
  display: flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 50%;
  border: 1.5px solid color-mix(in srgb, var(--faint) 60%, transparent);
  font-family: var(--font-mono); font-size: 13px; font-weight: 500; color: var(--faint);
}
.survey-error__title {
  margin: 0; font-family: var(--font-head); font-weight: var(--head-weight);
  font-size: clamp(28px, 4vw, 44px); line-height: 1.05;
  letter-spacing: var(--head-tracking); color: var(--fg);
}
.survey-error__message { margin: 0; font-size: 16.5px; line-height: 1.65; color: var(--muted); max-width: 46ch; }
.survey-error__actions { display: flex; flex-direction: column; gap: 14px; }
.survey-error__meta { margin: 0; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em; color: var(--faint); }
.survey-error__mailto {
  color: var(--accent); text-decoration: none;
  border-bottom: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
  transition: opacity 0.2s;
}
.survey-error__mailto:hover { opacity: 0.7; }

/* ═══════════════════════════════════════════════════════
   REDUCED MOTION
═══════════════════════════════════════════════════════ */
@media (prefers-reduced-motion: reduce) {
  .q-frame, .survey-phase { animation: none !important; }
  .survey-progress__bar { transition: none; }
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Survey endpoint — fill in after deploying google-apps-script/Code.gs -->
<script src="config.js"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="landing-ui.jsx"></script>
<script type="text/babel" src="survey-questions.jsx"></script>
<script type="text/babel" src="survey-shell.jsx"></script>

<script type="text/babel">
const TOTAL_Q = SURVEY_QUESTIONS.length;

const TWEAK_DEFAULTS = {
  theme: 'light', palette: ['#51624f', '#8a9a86'],
};
const PALETTES = [
  ['#51624f', '#8a9a86'], ['#9a7b4f', '#c2a878'],
  ['#3c3a35', '#9a958b'], ['#4e6173', '#93a2af'],
];

const { useState, useEffect, useCallback, useRef } = React;
const LS_KEY = 'az-survey-2026';

function timeLabel(qIndex) {
  const secs = (TOTAL_Q - qIndex) * 24;
  const mins = Math.ceil(secs / 60);
  return mins <= 1 ? '< 1 min' : `~${mins} min`;
}

function canContinue(q, answers) {
  if (!q) return false;
  const v = answers[q.id];
  if (q.type === 'single' || q.type === 'scale') return !!v;
  if (q.type === 'multi')  return v && v.length > 0;
  if (q.type === 'rating') return v && q.rows.every((r) => v[r] !== undefined);
  return false;
}

function resolveQuestion(q, answers) {
  if (q.derivedFrom) {
    const src = answers[q.derivedFrom] || [];
    if (src.length > 0) return { ...q, options: src };
  }
  return q;
}

function generateId() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const [savedState] = useState(() => {
    try { const r = localStorage.getItem(LS_KEY); if (r) return JSON.parse(r); } catch {}
    return null;
  });

  const [phase,          setPhase]          = useState('intro');
  const [activeQ,        setActiveQ]        = useState(0);
  const [answers,        setAnswers]        = useState({});
  const [pendingContact, setPendingContact] = useState(null);
  const qRefs = useRef([]);

  useEffect(() => {
    if (phase === 'survey' && Object.keys(answers).length > 0) {
      localStorage.setItem(LS_KEY, JSON.stringify({ answers, activeQ }));
    }
  }, [answers, activeQ, phase]);

  useEffect(() => { document.body.classList.toggle('theme-dark', t.theme === 'dark'); }, [t.theme]);
  useEffect(() => {
    document.documentElement.style.setProperty('--accent',  t.palette[0]);
    document.documentElement.style.setProperty('--accent2', t.palette[1]);
  }, [t.palette]);

  const advanceFrom = useCallback((i) => {
    if (i < TOTAL_Q - 1) {
      setActiveQ((prev) => Math.max(prev, i + 1));
      setTimeout(() => {
        qRefs.current[i + 1]?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 80);
    }
  }, []);

  const handleChange = useCallback((i, q, val) => {
    setAnswers((prev) => ({ ...prev, [q.id]: val }));
    if ((q.type === 'single' || q.type === 'scale') && i === activeQ) {
      setTimeout(() => advanceFrom(i), 120);
    }
  }, [activeQ, advanceFrom]);

  const handleSubmit = useCallback(async (contactData) => {
    const payload = {
      submission_id:         generateId(),
      timestamp:             new Date().toISOString(),
      completion_status:     'complete',
      firm_size:             answers.firm_size               ?? '',
      returns_filed:         answers.returns_filed            ?? '',
      client_mix:            (answers.client_mix             ?? []).join(', '),
      client_mix_other:      answers.client_mix_other         ?? '',
      biggest_challenges:    (answers.biggest_challenges      ?? []).join(', '),
      top_priority:          answers.top_priority             ?? '',
      workflow_friction:     (answers.workflow_friction        ?? []).join(', '),
      time_loss:             (answers.time_loss               ?? []).join(', '),
      time_loss_other:       answers.time_loss_other           ?? '',
      current_process:       (answers.current_process         ?? []).join(', '),
      current_process_other: answers.current_process_other    ?? '',
      process_satisfaction:  answers.process_satisfaction      ?? '',
      ai_openness:           answers.ai_openness               ?? '',
      ...contactData,
      source_page:           window.location.href,
      ...getUtmParams(),
      user_agent:            navigator.userAgent,
      device_type:           getDeviceType(),
    };

    localStorage.setItem(LS_KEY, JSON.stringify({ answers, activeQ, pendingPayload: payload }));

    try {
      await submitSurvey(payload);
      localStorage.removeItem(LS_KEY);
      setPhase('complete');
    } catch (err) {
      console.error('[Survey] Submission failed:', err);
      setPendingContact(contactData);
      setPhase('error');
    }
  }, [answers, activeQ]);

  const handleRetry = useCallback(async () => {
    if (pendingContact !== null) { setPhase('contact'); await handleSubmit(pendingContact); }
  }, [pendingContact, handleSubmit]);

  const handleStart = () => {
    setAnswers({}); setActiveQ(0); setPhase('survey');
  };
  const handleResume = () => {
    if (savedState) {
      setAnswers(savedState.answers || {});
      setActiveQ(savedState.activeQ || 0);
      setPhase('survey');
    }
  };

  const answeredCount = SURVEY_QUESTIONS.filter((q) => canContinue(q, answers)).length;
  const progress = phase === 'intro' ? 0 : phase === 'survey' ? answeredCount / TOTAL_Q : 1;
  const lastQ = SURVEY_QUESTIONS[TOTAL_Q - 1];
  const allDone = canContinue(lastQ, answers);

  return (
    <React.Fragment>
      <SurveyProgress progress={progress} />
      <div className="survey-page">
        <SurveyNav />
        <div className="survey-stage">
          <div className="survey-content">

            {phase === 'intro' && (
              <div className="survey-phase" key="intro">
                <SurveyIntro onStart={handleStart} onResume={handleResume}
                  hasSaved={!!(savedState && Object.keys(savedState.answers || {}).length > 0)} />
              </div>
            )}

            {phase === 'survey' && (
              <div className="survey-scroll-list">
                {SURVEY_QUESTIONS.map((rawQ, i) => {
                  if (i > activeQ) return null;
                  const q        = resolveQuestion(rawQ, answers);
                  const isActive = i === activeQ;
                  const isDone   = !isActive && canContinue(q, answers);
                  const showContinue = (q.type === 'multi' || q.type === 'rating') && isActive && canContinue(q, answers);
                  const section  = SURVEY_SECTIONS.find((s) => s.id === q.section);
                  return (
                    <div key={q.id} ref={(el) => { qRefs.current[i] = el; }}
                      className={'survey-q-section' + (isActive ? ' is-active' : '') + (isDone ? ' is-answered' : '')}>
                      <div className="q-meta">
                        <span className="q-section">
                          <span className="q-section__tick" aria-hidden="true" />
                          {section?.label}
                        </span>
                        <span className="q-meta-right">
                          <span>{i + 1} of {TOTAL_Q}</span>
                          <span className="q-meta-right__sep">·</span>
                          <span>{timeLabel(i)}</span>
                        </span>
                      </div>
                      <h2 className="q-text" style={{ marginTop: 10 }}>{q.text}</h2>
                      {q.hint    && <p className="q-hint"    style={{ marginTop: 8 }}>{q.hint}</p>}
                      {q.context && <p className="q-context" style={{ marginTop: 7 }}>{q.context}</p>}
                      <div style={{ marginTop: 20 }}>
                        <QuestionBody q={q} value={answers[q.id]}
                          onChange={(val) => handleChange(i, q, val)}
                          otherText={answers[q.id + '_other'] || ''}
                          onOtherChange={(text) => setAnswers((prev) => ({ ...prev, [q.id + '_other']: text }))} />
                      </div>
                      {showContinue && (
                        <button className="survey-q-continue" type="button" onClick={() => advanceFrom(i)}>
                          Continue
                          <svg width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                            <path d="M7 2.5v9M3.5 7.5 7 11l3.5-3.5" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round" />
                          </svg>
                        </button>
                      )}
                    </div>
                  );
                })}
                {activeQ === TOTAL_Q - 1 && allDone && (
                  <div className="survey-submit-row">
                    <button className="survey-primary-btn" type="button" onClick={() => setPhase('contact')}>
                      Submit responses
                      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true" style={{ flexShrink: 0 }}>
                        <path d="M2.5 7h9M7.5 3.5 11 7l-3.5 3.5" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round" />
                      </svg>
                    </button>
                  </div>
                )}
              </div>
            )}

            {phase === 'contact' && (
              <div className="survey-phase" key="contact">
                <SurveyContact onSubmit={handleSubmit} />
              </div>
            )}

            {phase === 'complete' && (
              <div className="survey-phase" key="complete">
                <SurveyComplete />
              </div>
            )}

            {phase === 'error' && (
              <div className="survey-phase" key="error">
                <SurveyError onRetry={handleRetry} />
              </div>
            )}

          </div>
        </div>
      </div>

      <TweaksPanel>
        <TweakSection label="Appearance" />
        <TweakRadio label="Theme" value={t.theme} options={['light', 'dark']}
          onChange={(v) => setTweak('theme', v)} />
        <TweakColor label="Accent" value={t.palette} options={PALETTES}
          onChange={(v) => setTweak('palette', v)} />
      </TweaksPanel>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
