<script type="text/babel">
/* ====================================================================
   Zoe Homepage — ported from the "Zoe Homepage Single Background"
   Claude Design canvas into a plain React static page (no build step),
   matching the CDN/inline-Babel pattern the rest of this site uses.
   ==================================================================== */

/* Isolated so its 150ms tick only re-renders this small subtree, not the
   whole page — keeping it on ZoeApp's top-level state caused a full-tree
   re-render ~6.6x/sec forever, which is unnecessary render churn. */
class Timeline extends React.Component {
  static MILESTONES = [
    { month: "JAN", title: "Onboarding", top: 0, t: 800 },
    { month: "MAR", title: "Documents received", top: 20, t: 4800 },
    { month: "APR", title: "Return filed", top: 40, t: 8800 },
    { month: "JUL", title: "Quarterly check-in", top: 60, t: 12800 },
    { month: "NOV", title: "Year-end planning", top: 80, t: 16800 }
  ];
  static YEAR_CYCLE_MS = 20000;

  state = { cycleT: 0 };

  componentDidMount() {
    this._year0 = performance.now();
    this._tick();
  }

  componentWillUnmount() {
    clearTimeout(this._timeoutId);
  }

  _tick = () => {
    const t = (performance.now() - this._year0) % Timeline.YEAR_CYCLE_MS;
    this.setState({ cycleT: t });
    this._timeoutId = setTimeout(this._tick, 150);
  };

  render() {
    const { cycleT } = this.state;
    const yearFillPct = (cycleT / Timeline.YEAR_CYCLE_MS * 100) + "%";
    const timelineItems = Timeline.MILESTONES.map(m => {
      const passed = cycleT >= m.t;
      return {
        month: m.month,
        title: m.title,
        rowStyle: { position: "absolute", left: 0, top: m.top + "%", transform: "translateY(-50%)", display: "flex", alignItems: "center", gap: 0, width: "100%" },
        markerStyle: { width: "7px", height: "7px", borderRadius: "50%", display: "block", border: "1.3px solid " + (passed ? "#51624f" : "#c9c4b7"), background: passed ? "#51624f" : "transparent", transition: "background 300ms, border-color 300ms" },
        titleStyle: { fontSize: "14.5px", fontWeight: 500, color: passed ? "#1c1c1a" : "#8a8880", transition: "color 300ms" },
        checkStyle: { color: "#51624f", opacity: passed ? 1 : 0, transform: passed ? "scale(1)" : "scale(0.6)", transition: "opacity 300ms, transform 300ms", display: "inline-flex" }
      };
    });
    return (
      <div style={{ position: "relative", flex: 1, marginTop: "14px", minHeight: 0 }}>
        <div style={{ position: "absolute", left: "47px", top: 0, bottom: 0, width: "1px", background: "rgba(28,28,26,0.1)" }}></div>
        <div style={{ position: "absolute", left: "47px", top: 0, height: yearFillPct, width: "1.5px", background: "#51624f" }}></div>
        <div style={{ position: "absolute", left: "47px", top: yearFillPct, width: "7px", height: "7px", marginLeft: "-3.5px", marginTop: "-3.5px", borderRadius: "50%", background: "#51624f", boxShadow: "0 0 0 4px rgba(81,98,79,0.14)" }}></div>

        {timelineItems.map((item, i) => (
          <div key={i} style={item.rowStyle}>
            <span style={{ width: "30px", flexShrink: 0, fontSize: "11px", letterSpacing: "0.04em", color: "#a39d92" }}>{item.month}</span>
            <span style={{ width: "34px", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center" }}><span style={item.markerStyle}></span></span>
            <div style={{ flex: 1, paddingLeft: "6px", display: "flex", alignItems: "center", gap: "7px" }}>
              <span style={item.titleStyle}>{item.title}</span>
              <span style={item.checkStyle}><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" strokeWidth="1.6"></circle><path d="M8 12.5l2.6 2.6L16.5 9" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"></path></svg></span>
            </div>
          </div>
        ))}
      </div>
    );
  }
}

            <div style={{ display: "flex", alignItems: "center", gap: "11px" }}>
              <a href="https://schema52.com" target="_blank" rel="noopener" className="footer-brand" style={{ display: "flex", alignItems: "center", flexShrink: 0 }}>
                <img src="assets/schema52-mark-light.svg" alt="Schema 52" style={{ height: "13px", width: "auto", display: "block", flexShrink: 0, opacity: 0.6 }} />
              </a>
              <span style={{ width: "1px", height: "11px", background: "rgba(28,28,26,0.15)", flexShrink: 0 }}></span>
              <span style={{ fontFamily: "'Hedvig Letters Serif',Georgia,'Times New Roman',serif", fontWeight: 500, fontSize: "14px", letterSpacing: "-0.01em", color: "rgba(28,28,26,0.55)" }}>Zoe</span>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: "14px", fontSize: "11px", letterSpacing: "0.01em", color: "rgba(28,28,26,0.4)" }}>
              <a href="https://schema52.com" target="_blank" rel="noopener" className="footer-link" style={{ color: "inherit", textDecoration: "none" }}>Zoe is a Schema 52 product</a>
              <span style={{ width: "3px", height: "3px", borderRadius: "50%", background: "rgba(28,28,26,0.18)", flexShrink: 0 }}></span>
              <span>© {new Date().getFullYear()} Schema 52</span>
            </div>
          </div>
        </section>

        {/* LET'S TALK MODAL */}
        {modalOpen && (
          <div onClick={this.closeModal} style={modalOverlayStyle}>
            <div onClick={(e) => e.stopPropagation()} style={modalPanelStyle}>
              <span className="modal-close" onClick={this.closeModal} style={modalCloseStyle}>×</span>

              {modalDone && (
                <div style={modalDoneWrapStyle}>
                  <span style={modalDoneDotStyle}></span>
                  <p style={modalDoneTextStyle}>Received. We review every introduction personally — someone from the team will be in touch soon.</p>
                </div>
              )}

              {modalError && (
                <div style={modalDoneWrapStyle}>
                  <span style={modalDoneDotStyle}></span>
                  <p style={modalDoneTextStyle}>Something went wrong on our end — please try again in a moment.</p>
                </div>
              )}

              {modalIdle && (
                <React.Fragment>
                  <h3 style={modalHeadlineStyle}>Let's talk.</h3>
                  <p style={modalSubcopyStyle}>Tell us a bit about your firm and we'll be in touch.</p>
                  <form onSubmit={this.submitModal} style={modalFormStyle}>
                    <input className="modal-field" type="email" required placeholder="Work email" aria-label="Work email" value={modalForm.email} onChange={(e) => this.onModalField("email", e)} style={modalFieldStyle} />
                    <div style={modalRow2Style}>
                      <input className="modal-field" type="text" placeholder="Your name" aria-label="Your name" value={modalForm.name} onChange={(e) => this.onModalField("name", e)} style={modalFieldStyle} />
                      <input className="modal-field" type="text" placeholder="Firm (optional)" aria-label="Firm (optional)" value={modalForm.firm} onChange={(e) => this.onModalField("firm", e)} style={modalFieldStyle} />
                    </div>
                    <button className="modal-submit" type="submit" disabled={modalSending} style={modalSubmitStyle}>{modalSubmitLabel}</button>
                  </form>
                </React.Fragment>
              )}
            </div>
          </div>
        )}

      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<ZoeApp />);
</script>
</body>
</html>
