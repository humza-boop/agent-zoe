  @keyframes typingDot { 0%,80%,100% { opacity:0.25; } 40% { opacity:1; } }

  @keyframes yearFill { 0% { height:0%; opacity:0; } 2% { opacity:1; } 88% { height:100%; opacity:1; } 94% { height:100%; opacity:1; } 98% { opacity:0; } 100% { height:0%; opacity:0; } }
  @keyframes yearDot { 0% { top:0%; opacity:0; } 2% { opacity:1; } 88% { top:100%; opacity:1; } 94% { top:100%; opacity:1; } 98% { opacity:0; } 100% { top:0%; opacity:0; } }
  @keyframes yearMarkerFill { 0% { border-color:#c9c4b7; background:transparent; transform:scale(1); } 4% { border-color:#51624f; background:#51624f; transform:scale(1.3); } 8% { border-color:#51624f; background:#51624f; transform:scale(1); } 90% { border-color:#51624f; background:#51624f; transform:scale(1); } 96% { border-color:#c9c4b7; background:transparent; transform:scale(1); } 100% { border-color:#c9c4b7; background:transparent; transform:scale(1); } }
  @keyframes yearTitleActive { 0% { color:#8a8880; } 4% { color:#1c1c1a; } 90% { color:#1c1c1a; } 96% { color:#8a8880; } 100% { color:#8a8880; } }
  @keyframes convGlyphMove { 0%,8% { opacity:1; transform:translate(0,0) scale(1); } 26% { opacity:1; transform:translate(calc(var(--dx)*0.9),calc(var(--dy)*0.9)) scale(0.72); } 34%,85% { opacity:0; transform:translate(var(--dx),var(--dy)) scale(0.4); } 95%,100% { opacity:1; transform:translate(0,0) scale(1); } }
  @keyframes dotLight { 0%,30% { opacity:0.35; transform:scale(0.65); background:transparent; border-color:#c9c4b7; } 36% { opacity:1; transform:scale(1.35); background:#51624f; border-color:#51624f; } 42%,85% { opacity:1; transform:scale(1); background:#51624f; border-color:#51624f; } 92%,100% { opacity:0.35; transform:scale(0.65); background:transparent; border-color:#c9c4b7; } }

  @keyframes pathDraw { 0%,8% { stroke-dashoffset:var(--len); opacity:0.85; } 34%,85% { stroke-dashoffset:0; opacity:1; } 92%,100% { stroke-dashoffset:var(--len); opacity:0.85; } }
  @keyframes nodeGlow { 0%,8% { opacity:0.35; transform:scale(0.7); } 26%,85% { opacity:1; transform:scale(1); } 92%,100% { opacity:0.35; transform:scale(0.7); } }
  @keyframes flowPulse { 0% { transform:translateX(0); opacity:0; } 15% { opacity:1; } 85% { opacity:1; } 100% { transform:translateX(26px); opacity:0; } }

  .modal-field:focus { border-bottom-color:#51624f !important; }

<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel">
/* ====================================================================
   Zoe Homepage — ported from the "Zoe Homepage Single Background"
   Claude Design canvas into a plain React static page (no build step),
   matching the CDN/inline-Babel pattern the rest of this site uses.
   ==================================================================== */

/* Isolated so its 150ms tick only re-renders this small subtree, not the
   whole page — keeping it on ZoeApp's top-level state caused a full-tree
   re-render ~6.6x/sec forever, which is unnecessary render churn. */
class Timeline extends React.Component {
  static MILESTONES = [
    { month: "JAN", title: "Onboarding", top: 0, t: 800 },
    { month: "MAR", title: "Documents received", top: 20, t: 4800 },
    { month: "APR", title: "Return filed", top: 40, t: 8800 },
    { month: "JUL", title: "Quarterly check-in", top: 60, t: 12800 },
    { month: "NOV", title: "Year-end planning", top: 80, t: 16800 }
  ];
  static YEAR_CYCLE_MS = 20000;

  state = { cycleT: 0 };

  componentDidMount() {
    this._year0 = performance.now();
    this._tick();
  }

  componentWillUnmount() {
    clearTimeout(this._timeoutId);
  }

  _tick = () => {
    const t = (performance.now() - this._year0) % Timeline.YEAR_CYCLE_MS;
    this.setState({ cycleT: t });
    this._timeoutId = setTimeout(this._tick, 150);
  };

  render() {
    const { cycleT } = this.state;
    const yearFillPct = (cycleT / Timeline.YEAR_CYCLE_MS * 100) + "%";
    const timelineItems = Timeline.MILESTONES.map(m => {
      const passed = cycleT >= m.t;
      return {
        month: m.month,
        title: m.title,
        rowStyle: { position: "absolute", left: 0, top: m.top + "%", transform: "translateY(-50%)", display: "flex", alignItems: "center", gap: 0, width: "100%" },
        markerStyle: { width: "7px", height: "7px", borderRadius: "50%", display: "block", border: "1.3px solid " + (passed ? "#51624f" : "#c9c4b7"), background: passed ? "#51624f" : "transparent", transition: "background 300ms, border-color 300ms" },
        titleStyle: { fontSize: "14.5px", fontWeight: 500, color: passed ? "#1c1c1a" : "#8a8880", transition: "color 300ms" },
        checkStyle: { color: "#51624f", opacity: passed ? 1 : 0, transform: passed ? "scale(1)" : "scale(0.6)", transition: "opacity 300ms, transform 300ms", display: "inline-flex" }
      };
    });
    return (
      <div style={{ position: "relative", flex: 1, marginTop: "14px", minHeight: 0 }}>
        <div style={{ position: "absolute", left: "47px", top: 0, bottom: 0, width: "1px", background: "rgba(28,28,26,0.1)" }}></div>
        <div style={{ position: "absolute", left: "47px", top: 0, height: yearFillPct, width: "1.5px", background: "#51624f" }}></div>
        <div style={{ position: "absolute", left: "47px", top: yearFillPct, width: "7px", height: "7px", marginLeft: "-3.5px", marginTop: "-3.5px", borderRadius: "50%", background: "#51624f", boxShadow: "0 0 0 4px rgba(81,98,79,0.14)" }}></div>

        {timelineItems.map((item, i) => (
          <div key={i} style={item.rowStyle}>
            <span style={{ width: "30px", flexShrink: 0, fontSize: "11px", letterSpacing: "0.04em", color: "#a39d92" }}>{item.month}</span>
            <span style={{ width: "34px", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center" }}><span style={item.markerStyle}></span></span>
            <div style={{ flex: 1, paddingLeft: "6px", display: "flex", alignItems: "center", gap: "7px" }}>
              <span style={item.titleStyle}>{item.title}</span>
              <span style={item.checkStyle}><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" strokeWidth="1.6"></circle><path d="M8 12.5l2.6 2.6L16.5 9" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"></path></svg></span>
            </div>
          </div>
        ))}
      </div>
    );
  }
}

class ZoeApp extends React.Component {
  static PHRASES = [
    "front desk",
    "client concierge",
    "client coordinator",
    "seasonal support",
    "tax season helper"
  ];

  static WORK_STATES = [
    { headline: "Meet clients where they are.", description: "Zoe collects documents securely and answers questions 24/7 across the channels your clients already use." },
    { headline: "Every channel gets resolved into one thread.", description: "SMS, email, calls, documents, and client interactions stay together in one continuous conversation. Zoe handles the follow-up, and your team steps in only when needed." },
    { headline: "Works with the tools you already use.", description: "Zoe works alongside the systems your firm already uses and adapts to the way your team operates." },
    { headline: "From tax season to every season.", description: "From onboarding and tax season to year-round service, Zoe keeps clients engaged and the next step moving." }
  ];

  static WASHES = [
    "radial-gradient(circle at 15% 0%, oklch(87% 0.07 95 / 0.48), transparent 58%), radial-gradient(circle at 100% 100%, oklch(30% 0.045 150 / 0.3), transparent 65%)",
    "radial-gradient(circle at 85% 100%, oklch(84% 0.08 125 / 0.55), transparent 58%), radial-gradient(circle at 0% 0%, oklch(28% 0.05 150 / 0.34), transparent 65%)",
    "radial-gradient(circle at 10% 100%, oklch(87% 0.08 70 / 0.48), transparent 58%), radial-gradient(circle at 100% 0%, oklch(30% 0.045 150 / 0.28), transparent 65%)",
    "radial-gradient(circle at 90% 0%, oklch(87% 0.06 20 / 0.45), transparent 58%), radial-gradient(circle at 0% 100%, oklch(30% 0.05 150 / 0.3), transparent 65%)"
  ];

  static AMBIENT = (() => {
    const dotY = [22, 78, 134, 190, 246, 301];
    const colors = ["oklch(58% 0.1 250 / 0.55)", "oklch(62% 0.12 70 / 0.55)", "oklch(58% 0.09 20 / 0.55)", "oklch(46% 0.06 150 / 0.55)"];
    const arr = [];
    for (let i = 0; i < 26; i++) {
      const left = 6 + ((i * 47) % 302);
      const top = 8 + ((i * 71) % 288);
      const ty = dotY[i % 6];
      arr.push({
        left, top,
        size: 3 + (i % 4),
        opacity: 0.3 + ((i % 5) * 0.08),
        color: colors[i % 4],
        dx: 158 - left,
        dy: ty - top,
        delay: -((i * 1.13) % 20)
      });
    }
    return arr;
  })();

  static SCRIPT = [
    { type: "date", text: "Monday · 9:12 AM", delay: 1300 },
    { type: "typing", side: "zoe", delay: 900 },
    { type: "msg", kind: "text", side: "zoe", showLabel: true, text: "Good morning Sarah! I'm helping the Smith & Patel Tax team with your 2025 return.", delay: 1400 },
    { type: "typing", side: "zoe", delay: 800 },
    { type: "msg", kind: "text", side: "zoe", text: "We're still missing your 1099-INT and K-1. Do you have either yet?", delay: 1300 },
    { type: "typing", side: "sarah", delay: 800 },
    { type: "msg", kind: "text", side: "sarah", text: "I have the Chase one, still waiting on the K-1.", delay: 1000 },
    { type: "msg", kind: "link", side: "zoe", delay: 900 },
    { type: "typing", side: "sarah", delay: 700 },
    { type: "msg", kind: "attachment", side: "sarah", fileName: "1099-INT.pdf", status: "Delivered", delay: 900 },
    { type: "typing", side: "zoe", delay: 600 },
    { type: "msg", kind: "text", side: "zoe", showLabel: true, text: "Got it — we'll keep watching for the K-1.", delay: 900 },
    { type: "typing", side: "sarah", delay: 500 },
    { type: "msg", kind: "attachment", side: "sarah", fileName: "K1.pdf", status: "Delivered", delay: 700 },
    { type: "typing", side: "zoe", delay: 500 },
    { type: "msg", kind: "text", side: "zoe", showLabel: true, text: "Everything's in. Your return is moving into preparation.", delay: 1600 }
  ];

  static TOOLS = [
    { name: "QuickBooks", initial: "Q", bg: "#2CA01C22", fg: "#1f7a12" },
    { name: "Karbon", initial: "K", bg: "#1B2B4B22", fg: "#1B2B4B" },
    { name: "Gmail", initial: "G", bg: "#EA433522", fg: "#c53020" },
    { name: "Xero", initial: "X", bg: "#13B5EA22", fg: "#0a90bd" },
    { name: "Outlook", initial: "O", bg: "#0078D422", fg: "#0060ab" },
    { name: "HubSpot", initial: "H", bg: "#FF7A5922", fg: "#d9532e" },
    { name: "Google Drive", initial: "D", bg: "#4285F422", fg: "#2f5fc4" },
    { name: "Canopy", initial: "C", bg: "#00B3A422", fg: "#008c80" },
    { name: "Teams", initial: "T", bg: "#6264A722", fg: "#4b4d8a" },
    { name: "TaxDome", initial: "TD", bg: "#2F6FE422", fg: "#2455b3" }
  ];

  static MILESTONES = [
    { month: "JAN", title: "Onboarding", top: 0, t: 800 },
    { month: "MAR", title: "Documents received", top: 20, t: 4800 },
    { month: "APR", title: "Return filed", top: 40, t: 8800 },
    { month: "JUL", title: "Quarterly check-in", top: 60, t: 12800 },
    { month: "NOV", title: "Year-end planning", top: 80, t: 16800 }
  ];
  static YEAR_CYCLE_MS = 20000;
  static SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxRL2a3zrR5vgjRlRPnluO6O8PXwYBFb4AluihMjJgLTP3-uB2u_64TIR6dIwx6_jKP/exec";

  state = { index: 0, phase: "visible", active: 0, messages: [], showChannels: false, pilotInView: false, contextInView: false, howInView: false, finalCtaInView: false, modalOpen: false, modalStatus: "idle", modalForm: { email: "", name: "", firm: "" }, isMobile: typeof window !== "undefined" && window.innerWidth <= 768 };
  threadInnerRef = React.createRef();
  threadOuterRef = React.createRef();
  pilotSectionRef = React.createRef();
  contextSectionRef = React.createRef();
  howSectionRef = React.createRef();
  finalCtaSectionRef = React.createRef();
  msgKey = 0;

  openModal = (e) => {
    if (e) e.preventDefault();
    this.setState({ modalOpen: true, modalStatus: "idle", modalForm: { email: "", name: "", firm: "" } });
  };

  closeModal = () => {
    this.setState({ modalOpen: false });
  };

  onModalField = (key, e) => {
    const val = e.target.value;
    this.setState(s => ({ modalForm: { ...s.modalForm, [key]: val } }));
  };

  submitModal = async (e) => {
    e.preventDefault();
    this.setState({ modalStatus: "sending" });
    try {
      await fetch(ZoeApp.SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify({ ...this.state.modalForm, source_page: "zoe-homepage" })
      });
      this.setState({ modalStatus: "done" });
    } catch (err) {
      this.setState({ modalStatus: "error" });
    }
  };

  selectState = (i) => {
    this.setState({ active: i });
    if (i === 0) this.runScript();
    else (this.scriptTimers || []).forEach(clearTimeout);
  };

  playEvent = (ev) => {
    this.setState(s => {
      const messages = s.messages.slice();
      if (ev.type === "typing") {
        messages.push({ key: this.msgKey++, kind: "typing", side: ev.side });
      } else if (ev.type === "date") {
        messages.push({ key: this.msgKey++, kind: "date", text: ev.text });
      } else {
        if (messages.length && messages[messages.length - 1].kind === "typing") messages.pop();
        messages.push({ key: this.msgKey++, kind: ev.kind, side: ev.side, text: ev.text, fileName: ev.fileName, status: ev.status, showLabel: ev.showLabel });
      }
      return { messages };
    }, () => {
      const outer = this.threadOuterRef.current;
      if (outer && !this._userScrolled) {
        requestAnimationFrame(() => { if (outer) outer.scrollTo({ top: outer.scrollHeight, behavior: "smooth" }); });
      }
    });
  };

  runScript() {
    (this.scriptTimers || []).forEach(clearTimeout);
    this._userScrolled = false;
    this.setState({ messages: [], showChannels: false });
    this.scriptTimers = [];
    let t = 300;
    ZoeApp.SCRIPT.forEach(ev => {
      this.scriptTimers.push(setTimeout(() => this.playEvent(ev), t));
      t += ev.delay;
    });
    this.scriptTimers.push(setTimeout(() => this.setState({ showChannels: true }), t + 300));
  }

  componentDidMount() {
    this.timer = setInterval(() => this.cycle(), 3200);
    this.scriptTimers = [];
    this.runScript();
    if (this.pilotSectionRef.current) {
      this._pilotObserver = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting) {
          this.setState({ pilotInView: true });
          this._pilotObserver.disconnect();
        }
      }, { threshold: 0.25 });
      this._pilotObserver.observe(this.pilotSectionRef.current);
    }
    if (this.contextSectionRef.current) {
      this._contextObserver = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting) {
          this.setState({ contextInView: true });
          this._contextObserver.disconnect();
        }
      }, { threshold: 0.3 });
      this._contextObserver.observe(this.contextSectionRef.current);
    }
    if (this.howSectionRef.current) {
      this._howObserver = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting) {
          this.setState({ howInView: true });
          this._howObserver.disconnect();
        }
      }, { threshold: 0.25 });
      this._howObserver.observe(this.howSectionRef.current);
    }
    this._onKeydown = (e) => { if (e.key === "Escape" && this.state.modalOpen) this.closeModal(); };
    window.addEventListener("keydown", this._onKeydown);
    this._onResize = () => {
      const m = window.innerWidth <= 768;
      if (m !== this.state.isMobile) this.setState({ isMobile: m });
    };
    window.addEventListener("resize", this._onResize);
    if (this.finalCtaSectionRef.current) {
      this._finalCtaObserver = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting) {
          this.setState({ finalCtaInView: true });
          this._finalCtaObserver.disconnect();
        }
      }, { threshold: 0.3 });
      this._finalCtaObserver.observe(this.finalCtaSectionRef.current);
    }
  }

  componentWillUnmount() {
    clearInterval(this.timer);
    window.removeEventListener("keydown", this._onKeydown);
    window.removeEventListener("resize", this._onResize);
    if (this._pilotObserver) this._pilotObserver.disconnect();
    if (this._contextObserver) this._contextObserver.disconnect();
    if (this._howObserver) this._howObserver.disconnect();
    if (this._finalCtaObserver) this._finalCtaObserver.disconnect();
    (this.scriptTimers || []).forEach(clearTimeout);
  }

  cycle() {
    this.setState({ phase: "out" });
    setTimeout(() => {
      this.setState(s => ({ index: (s.index + 1) % ZoeApp.PHRASES.length, phase: "in" }));
      requestAnimationFrame(() => requestAnimationFrame(() => this.setState({ phase: "visible" })));
    }, 380);
  }

  onThreadScroll = () => { if (this.state.showChannels) this._userScrolled = true; };

  render() {
    const { index, phase, active, messages, pilotInView, contextInView, howInView, finalCtaInView, modalOpen, modalStatus, modalForm, isMobile } = this.state;

    /* ---------- modal-derived values ---------- */
    const modalIdle = modalStatus === "idle" || modalStatus === "sending";
    const modalDone = modalStatus === "done";
    const modalError = modalStatus === "error";
    const modalSending = modalStatus === "sending";
    const modalSubmitLabel = modalSending ? "Sending…" : "Submit";

    const modalOverlayStyle = {
      position: "fixed", inset: 0, zIndex: 200, background: "rgba(28,28,26,0.5)",
      backdropFilter: "blur(3px)", display: "flex", alignItems: "center", justifyContent: "center", padding: "24px"
    };
    const modalPanelStyle = {
      position: "relative", width: "100%", maxWidth: "440px", background: "#f9faf9",
      border: "1px solid rgba(28,28,26,0.1)", borderRadius: "6px", padding: isMobile ? "34px 22px" : "44px 40px",
      boxShadow: "0 30px 80px rgba(20,20,15,0.28)", animation: "modalIn 320ms cubic-bezier(0.16,1,0.3,1) both"
    };
    const modalCloseStyle = {
      position: "absolute", top: "18px", right: "20px", fontSize: "22px", lineHeight: 1, color: "#4a4943",
      opacity: 0.6, cursor: "pointer", fontFamily: "'Inter',sans-serif"
    };
    const modalHeadlineStyle = {
      margin: "0 0 10px", fontFamily: "'Hedvig Letters Serif',Georgia,'Times New Roman',serif",
      fontWeight: 400, fontSize: "28px", letterSpacing: "-0.01em", color: "#1c1c1a"
    };
    const modalSubcopyStyle = { margin: "0 0 28px", fontSize: "14.5px", lineHeight: 1.6, color: "#6b6a63", maxWidth: "36ch" };

              <span style={{ position: "absolute", right: "0.5%", top: "76%", transform: "rotate(1deg)", fontFamily: "'Hedvig Letters Serif',Georgia,'Times New Roman',serif", fontStyle: "italic", fontSize: "13.5px", color: "rgba(28,28,26,0.16)" }}>"Are we still on track?"</span>
              <span style={{ position: "absolute", right: "1%", bottom: "8%", transform: "rotate(-1deg)", fontFamily: "'Hedvig Letters Serif',Georgia,'Times New Roman',serif", fontStyle: "italic", fontSize: "13.5px", color: "rgba(28,28,26,0.13)" }}>"Just checking in…"</span>
              <span style={{ position: "absolute", left: "1%", bottom: "14%", transform: "rotate(2deg)", fontSize: "12.5px", color: "rgba(28,28,26,0.13)", letterSpacing: "0.01em" }}>Schedule C</span>
              <span style={{ position: "absolute", left: "6%", top: "56%", transform: "rotate(-2deg)", fontFamily: "'Hedvig Letters Serif',Georgia,'Times New Roman',serif", fontStyle: "italic", fontSize: "13.5px", color: "rgba(28,28,26,0.14)" }}>"Did you get my email?"</span>
              <span style={{ position: "absolute", right: "5%", top: "60%", transform: "rotate(1deg)", fontSize: "12.5px", color: "rgba(28,28,26,0.13)", letterSpacing: "0.01em" }}>Extension filed</span>
            </div>

            <div style={{ maxWidth: "600px", margin: "0 auto", textAlign: "center", position: "relative", zIndex: 1 }}>
              <h2 style={contextHeadlineStyle}>Every return starts with a conversation.<br />Then another. And another.</h2>
              <p style={contextCopyStyle}>Documents arrive. Questions come in. Clients need reminders. Someone wants a status update. Before long, your team is stuck in a constant loop of chasing, answering, reminding, and following up.</p>
              <div style={contextDividerStyle}></div>
              <p style={contextClosingStyle}>Zoe breaks the loop.</p>
            </div>
          </div>
        </section>

        {/* HOW ZOE WORKS (interactive) */}
        <section id="how-it-works" style={howOuterSectionStyle}>
          <div ref={this.howSectionRef} style={howGridStyle}>
            <div>
              <p style={howEyebrowStyle}>How Zoe Works</p>
              <h2 style={howHeadlineStyle}>{s.headline}</h2>
              <p style={howDescriptionStyle}>{s.description}</p>
              <p style={channelLineStyle}>Also reachable by email, voice, and chat.</p>

              <div style={howNavStyle}>
                {navButtons.map((item, i) => (
                  <span key={i} onClick={item.onClick} style={item.numStyle}>{item.label}</span>
                ))}
              </div>
              <div style={trackStyle}>
                <div style={indicatorStyle}></div>
              </div>
            </div>

            <div style={howPreviewStyle}>
              <div style={previewOuterWrapStyle}>
                <div style={previewBoxStyle}>
                  <div style={washStyle}></div>
                  <div style={previewInnerPadStyle}>

                    {/* STATE 1: meets clients where they are */}
                    <div style={{ display: active === 0 ? "flex" : "none", flexDirection: "column", gap: 0, width: "100%", height: "100%" }}>
                      <div ref={this.threadOuterRef} onScroll={this.onThreadScroll} style={threadOuterStyle}>
                        <div style={threadFadeStyle}></div>
                        <div ref={this.threadInnerRef} style={threadInnerStyle}>
                          {renderedMessages}
                        </div>
                      </div>
                    </div>

                    {/* STATE 2: self-assembling thread */}
                    <div style={{ display: active === 1 ? "flex" : "none", flexDirection: "column", width: "100%", height: "100%", justifyContent: "center", alignItems: "center" }}>
                      <div style={{ position: "relative", width: 328 * state2Scale, height: 312 * state2Scale }}>
                      <div style={{ position: "absolute", top: 0, left: 0, width: "328px", height: "312px", transform: `scale(${state2Scale})`, transformOrigin: "top left" }}>
                        {ambientGlyphs.map(g => <div key={g.key} style={g.style}></div>)}
                        <div style={{ position: "absolute", left: "157px", top: "22px", bottom: "22px", width: "1px", background: "rgba(28,28,26,0.1)" }}></div>

                        <div style={{ position: "absolute", left: "151px", top: "22px", width: "13px", height: "13px", borderRadius: "50%", border: "1.3px solid #c9c4b7", animation: "dotLight 20s ease-in-out infinite", animationDelay: "0s" }}></div>
                        <div style={{ position: "absolute", left: "151px", top: "78px", width: "13px", height: "13px", borderRadius: "50%", border: "1.3px solid #c9c4b7", animation: "dotLight 20s ease-in-out infinite", animationDelay: "-2.4s" }}></div>
                        <div style={{ position: "absolute", left: "151px", top: "134px", width: "13px", height: "13px", borderRadius: "50%", border: "1.3px solid #c9c4b7", animation: "dotLight 20s ease-in-out infinite", animationDelay: "-4.8s" }}></div>
                        <div style={{ position: "absolute", left: "151px", top: "190px", width: "13px", height: "13px", borderRadius: "50%", border: "1.3px solid #c9c4b7", animation: "dotLight 20s ease-in-out infinite", animationDelay: "-1.2s" }}></div>
                        <div style={{ position: "absolute", left: "151px", top: "246px", width: "13px", height: "13px", borderRadius: "50%", border: "1.3px solid #c9c4b7", animation: "dotLight 20s ease-in-out infinite", animationDelay: "-3.6s" }}></div>
                        <div style={{ position: "absolute", left: "151px", top: "301px", width: "13px", height: "13px", borderRadius: "50%", border: "1.3px solid #c9c4b7", animation: "dotLight 20s ease-in-out infinite", animationDelay: "-6s" }}></div>

                        <div style={{ position: "absolute", left: "8px", top: "16px", color: "oklch(58% 0.11 250)", "--dx": "143px", "--dy": "8px", animation: "convGlyphMove 20s ease-in-out infinite", animationDelay: "0s" }}><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H9l-4 4V5z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round"></path></svg></div>
                        <div style={{ position: "absolute", left: "264px", top: "46px", color: "oklch(66% 0.13 70)", "--dx": "-113px", "--dy": "34px", animation: "convGlyphMove 20s ease-in-out infinite", animationDelay: "-2.4s" }}><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 6h16v12H4V6z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round"></path><path d="M4 6l8 7 8-7" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round"></path></svg></div>
                        <div style={{ position: "absolute", left: "18px", top: "130px", color: "#51624f", "--dx": "133px", "--dy": "6px", animation: "convGlyphMove 20s ease-in-out infinite", animationDelay: "-4.8s" }}><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 2h9l3 3v17H6V2z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round"></path><path d="M15 2v3h3" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round"></path></svg></div>
                        <div style={{ position: "absolute", left: "268px", top: "206px", color: "oklch(62% 0.1 20)", "--dx": "-117px", "--dy": "-14px", animation: "convGlyphMove 20s ease-in-out infinite", animationDelay: "-1.2s" }}><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 4c1 0 3 0.3 3.6 1.6.4 1 .1 2-.6 2.8-.6.7-.6 1 0 2 1.3 1.9 2.6 3.2 4.5 4.5.9.6 1.3.6 2 0 .8-.7 1.8-1 2.8-.6C18.7 15 19 17 19 18c0 1-1 2-2 2-6 0-13-7-13-13 0-1 1-2 1-2z" stroke="currentColor" strokeWidth="1.4" strokeLinejoin="round"></path></svg></div>
                        <div style={{ position: "absolute", left: "14px", top: "260px", color: "#51624f", "--dx": "137px", "--dy": "-12px", animation: "convGlyphMove 20s ease-in-out infinite", animationDelay: "-3.6s" }}><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" strokeWidth="1.4"></circle><path d="M8 12.5l2.6 2.6L16.5 9" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"></path></svg></div>
                        <div style={{ position: "absolute", left: "260px", top: "296px", color: "oklch(58% 0.11 250)", "--dx": "-109px", "--dy": "8px", animation: "convGlyphMove 20s ease-in-out infinite", animationDelay: "-6s" }}><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H9l-4 4V5z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round"></path></svg></div>
                      </div>
                      </div>
                    </div>

                    {/* STATE 3: real ecosystem, two drifting rows */}
                    <div style={{ display: active === 2 ? "flex" : "none", flexDirection: "column", width: "100%", height: "100%", justifyContent: "center" }}>
                      <div style={marqueeWrapStyle}>
                        <div style={{ position: "absolute", left: 0, top: 0, bottom: 0, width: "36px", background: "linear-gradient(to right, #f9faf9, transparent)", zIndex: 2, pointerEvents: "none" }}></div>
                        <div style={{ position: "absolute", right: 0, top: 0, bottom: 0, width: "36px", background: "linear-gradient(to left, #f9faf9, transparent)", zIndex: 2, pointerEvents: "none" }}></div>
                        <div style={{ overflow: "hidden", padding: "8px 0" }}>
                          <div style={{ display: "flex", gap: "12px", width: "max-content", animation: "marqueeLeft 32s linear infinite" }}>
                            {toolRow1.map((tool, i) => (
                              <span key={i} style={{ display: "inline-flex", alignItems: "center", gap: "8px", flexShrink: 0, background: "#ffffff", border: "1px solid rgba(28,28,26,0.1)", borderRadius: "20px", padding: "7px 14px 7px 8px" }}>
                                <span style={{ width: "20px", height: "20px", borderRadius: "6px", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "10px", fontWeight: 700, flexShrink: 0, background: tool.bg, color: tool.fg }}>{tool.initial}</span>
                                <span style={{ fontSize: "12.5px", color: "#3a3a37", whiteSpace: "nowrap" }}>{tool.name}</span>
                              </span>
                            ))}
                          </div>
                        </div>
                        <div style={{ overflow: "hidden", padding: "8px 0", marginTop: "14px" }}>
                          <div style={{ display: "flex", gap: "12px", width: "max-content", animation: "marqueeLeft 32s linear infinite reverse" }}>
                            {toolRow2.map((tool, i) => (
                              <span key={i} style={{ display: "inline-flex", alignItems: "center", gap: "8px", flexShrink: 0, background: "#ffffff", border: "1px solid rgba(28,28,26,0.1)", borderRadius: "20px", padding: "7px 14px 7px 8px" }}>
                                <span style={{ width: "20px", height: "20px", borderRadius: "6px", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "10px", fontWeight: 700, flexShrink: 0, background: tool.bg, color: tool.fg }}>{tool.initial}</span>
                                <span style={{ fontSize: "12.5px", color: "#3a3a37", whiteSpace: "nowrap" }}>{tool.name}</span>
                              </span>
                            ))}
                          </div>
                        </div>
                      </div>
                      <p style={{ margin: "28px 0 0", fontSize: "13px", lineHeight: 1.5, color: "#6b6a63", textAlign: "center" }}>And dozens more, connected through your existing stack.</p>
                    </div>

                    {/* STATE 4: keeps relationships moving */}
                    <div style={{ display: active === 3 ? "flex" : "none", flexDirection: "column", gap: 0, width: "100%", height: "100%" }}>
                      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", paddingBottom: "14px", borderBottom: "1px solid rgba(28,28,26,0.08)", marginBottom: "4px", flexShrink: 0 }}>
                        <span style={{ fontSize: "12.5px", letterSpacing: "0.02em", color: "#1c1c1a" }}>Sarah Mitchell</span>
                        <span style={{ fontSize: "11px", letterSpacing: "0.04em", color: "#a39d92" }}>2026</span>
                      </div>
                      <Timeline />
                    </div>

                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>

        {/* PILOT PROGRAM */}
        <section id="pilot" ref={this.pilotSectionRef} style={pilotOuterStyle}>
          <div style={{ maxWidth: "1180px", margin: "0 auto" }}>
            <div style={{ maxWidth: "600px" }}>
              <p style={pilotEyebrowStyle}>PILOT PROGRAM</p>
              <h2 style={pilotHeadlineStyle}>We're partnering with a small number of firms for the 2027 tax season.</h2>
              <p style={pilotCopyStyle}>These are real client engagements, not demos. Pilot firms work closely with us to shape Zoe before a broader rollout.</p>
            </div>

            <div style={pilotDetailsStyle}>
              <div style={{ borderTop: "1px solid rgba(28,28,26,0.14)", paddingTop: "20px" }}>
                <p style={{ margin: "0 0 14px", fontSize: "11px", letterSpacing: "0.1em", color: "#51624f" }}>01</p>
                <h3 style={{ margin: "0 0 10px", fontWeight: 600, fontSize: "15px", color: "#1c1c1a" }}>Scope</h3>
                <p style={{ margin: 0, fontSize: "14.5px", lineHeight: 1.62, color: "#6b6a63", maxWidth: "26ch" }}>A defined client group large enough to matter, such as returning 1040 clients with historically high administrative effort.</p>
              </div>
              <div style={{ borderTop: "1px solid rgba(28,28,26,0.14)", paddingTop: "20px" }}>
                <p style={{ margin: "0 0 14px", fontSize: "11px", letterSpacing: "0.1em", color: "#51624f" }}>02</p>
                <h3 style={{ margin: "0 0 10px", fontWeight: 600, fontSize: "15px", color: "#1c1c1a" }}>Duration</h3>
                <p style={{ margin: 0, fontSize: "14.5px", lineHeight: 1.62, color: "#6b6a63", maxWidth: "26ch" }}>One tax season, with roughly four months of implementation and configuration beforehand.</p>
              </div>
              <div style={{ borderTop: "1px solid rgba(28,28,26,0.14)", paddingTop: "20px" }}>
                <p style={{ margin: "0 0 14px", fontSize: "11px", letterSpacing: "0.1em", color: "#51624f" }}>03</p>
                <h3 style={{ margin: "0 0 10px", fontWeight: 600, fontSize: "15px", color: "#1c1c1a" }}>Your role</h3>
                <p style={{ margin: 0, fontSize: "14.5px", lineHeight: 1.62, color: "#6b6a63", maxWidth: "26ch" }}>Help shape Zoe during implementation. Once tax season begins, we manage the day-to-day. <span style={{ color: "#1c1c1a", fontWeight: 500 }}>Your team reviews exceptions.</span></p>
              </div>
            </div>
          </div>
        </section>

        {/* FINAL CTA / PAGE END */}
        <section id="final-cta" ref={this.finalCtaSectionRef} style={finalCtaOuterStyle}>
          <div style={{ maxWidth: "560px", textAlign: "center", display: "flex", flexDirection: "column", alignItems: "center", gap: "26px" }}>
            <h2 style={finalHeadlineStyle}>Tax season, without the busywork.</h2>
            <p style={finalCopyStyle}>See how Zoe can turn busywork into time for better work.</p>
            <a id="final-cta-btn" href="mailto:hello@schema52.com" onClick={this.openModal} style={finalBtnStyle}>Let's Talk <span className="cta-arrow">→</span></a>
          </div>
          <div style={{ marginTop: "100px", paddingBottom: "64px", display: "flex", flexDirection: "column", alignItems: "center", gap: "14px" }}>
            <div style={{ display: "flex", alignItems: "center", gap: "11px" }}>
              <a href="https://schema52.com" target="_blank" rel="noopener" className="footer-brand" style={{ display: "flex", alignItems: "center", flexShrink: 0 }}>
                <img src="assets/schema52-mark-light.svg" alt="Schema 52" style={{ height: "13px", width: "auto", display: "block", flexShrink: 0, opacity: 0.6 }} />
              </a>
              <span style={{ width: "1px", height: "11px", background: "rgba(28,28,26,0.15)", flexShrink: 0 }}></span>
              <span style={{ fontFamily: "'Hedvig Letters Serif',Georgia,'Times New Roman',serif", fontWeight: 500, fontSize: "14px", letterSpacing: "-0.01em", color: "rgba(28,28,26,0.55)" }}>Zoe</span>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: "14px", fontSize: "11px", letterSpacing: "0.01em", color: "rgba(28,28,26,0.4)" }}>
              <a href="https://schema52.com" target="_blank" rel="noopener" className="footer-link" style={{ color: "inherit", textDecoration: "none" }}>Zoe is a Schema 52 product</a>
              <span style={{ width: "3px", height: "3px", borderRadius: "50%", background: "rgba(28,28,26,0.18)", flexShrink: 0 }}></span>
              <span>© {new Date().getFullYear()} Schema 52</span>
            </div>
          </div>
        </section>

        {/* LET'S TALK MODAL */}
        {modalOpen && (
          <div onClick={this.closeModal} style={modalOverlayStyle}>
            <div onClick={(e) => e.stopPropagation()} style={modalPanelStyle}>
              <span className="modal-close" onClick={this.closeModal} style={modalCloseStyle}>×</span>

              {modalDone && (
                <div style={modalDoneWrapStyle}>
                  <span style={modalDoneDotStyle}></span>
                  <p style={modalDoneTextStyle}>Received. We review every introduction personally — someone from the team will be in touch soon.</p>
                </div>
              )}

              {modalError && (
                <div style={modalDoneWrapStyle}>
                  <span style={modalDoneDotStyle}></span>
                  <p style={modalDoneTextStyle}>Something went wrong on our end — please try again in a moment.</p>
                </div>
              )}

              {modalIdle && (
                <React.Fragment>
                  <h3 style={modalHeadlineStyle}>Let's talk.</h3>
                  <p style={modalSubcopyStyle}>Tell us a bit about your firm and we'll be in touch.</p>
                  <form onSubmit={this.submitModal} style={modalFormStyle}>
                    <input className="modal-field" type="email" required placeholder="Work email" aria-label="Work email" value={modalForm.email} onChange={(e) => this.onModalField("email", e)} style={modalFieldStyle} />
                    <div style={modalRow2Style}>
                      <input className="modal-field" type="text" placeholder="Your name" aria-label="Your name" value={modalForm.name} onChange={(e) => this.onModalField("name", e)} style={modalFieldStyle} />
                      <input className="modal-field" type="text" placeholder="Firm (optional)" aria-label="Firm (optional)" value={modalForm.firm} onChange={(e) => this.onModalField("firm", e)} style={modalFieldStyle} />
                    </div>
                    <button className="modal-submit" type="submit" disabled={modalSending} style={modalSubmitStyle}>{modalSubmitLabel}</button>
                  </form>
                </React.Fragment>
              )}
            </div>
          </div>
        )}

      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<ZoeApp />);
</script>
</body>
</html>
